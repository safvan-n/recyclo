<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ReCyclo – Turning Waste into Worth | Smart Waste & Recycling App</title>
  <meta name="description" content="ReCyclo connects you with verified local waste collectors for on-demand doorstep pickups, instant digital payouts, and circular recycling.">
  
  <!-- Favicon and PWA App Icons using exact official logo -->
  <link rel="icon" type="image/jpeg" href="assets/recyclo-logo.jpg">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00A884">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReCyclo">

  <!-- Core Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile-shell.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <!-- Top Demo Navigator Bar for easy inspection -->
  <div class="demo-bar" id="demo-controls-bar">
    <button class="demo-chip-btn" onclick="state.navigate('splash')">Splash</button>
    <button class="demo-chip-btn" onclick="state.navigate('onboarding')">Onboarding</button>
    <button class="demo-chip-btn" onclick="state.navigate('login')">Login</button>
    <button class="demo-chip-btn" onclick="state.navigate('home')">Home</button>
    <button class="demo-chip-btn" onclick="state.setWasteDraft({step: 1}); state.navigate('add-waste')">Add Waste</button>
    <button class="demo-chip-btn" onclick="state.navigate('collector-matching')">Matching</button>
    <button class="demo-chip-btn" onclick="state.navigate('chat')">Chat</button>
    <button class="demo-chip-btn" onclick="state.navigate('live-tracking')">Live Tracking</button>
    <button class="demo-chip-btn" onclick="state.navigate('rating')">Review</button>
    <button class="demo-chip-btn" onclick="state.navigate('profile')">Profile</button>
  </div>

  <!-- Mobile Viewport Wrapper -->
  <main class="app-viewport-wrapper">
    <div class="mobile-device-frame" id="mobile-device-frame">
      <!-- Dynamic Island / Speaker Pill -->
      <div class="device-notch-area" aria-hidden="true">
        <div class="device-camera-lens"></div>
        <div class="device-speaker-grill"></div>
      </div>

      <!-- Simulated Mobile Status Bar -->
      <div class="mobile-status-bar" id="mobile-status-bar">
        <span id="status-clock" style="font-weight: 700; letter-spacing: -0.01em;">09:41</span>
        <div class="status-bar-icons">
          <!-- Signal -->
          <svg class="status-icon-svg" viewBox="0 0 24 24">
            <path d="M2 20h20L12 4 2 20z"/>
          </svg>
          <!-- Wifi -->
          <svg class="status-icon-svg" viewBox="0 0 24 24">
            <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"/>
          </svg>
          <!-- Battery -->
          <svg class="status-icon-svg" viewBox="0 0 24 24" style="width: 18px;">
            <path d="M16 4h-2V2h-4v2H8C6.9 4 6 4.9 6 6v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-1 10h-2v4h-2v-4H9v-2h2v-4h2v4h2v2z"/>
          </svg>
        </div>
      </div>

      <!-- Toast Notification Container -->
      <div class="toast-container" id="toast-container" aria-live="polite"></div>

      <!-- In-App Simulated Call Screen Overlay -->
      <div id="call-overlay-container" style="display: none;"></div>

      <!-- Main Application Canvas -->
      <div class="app-screen-container" id="app-screen-container">
        <!-- Rendered dynamically by Screens and App router -->
      </div>

      <!-- Bottom Sheet Modal Backdrop & Container -->
      <div class="sheet-backdrop" id="sheet-backdrop"></div>
      <div class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true">
        <div class="sheet-handle-bar"></div>
        <div class="sheet-header">
          <h3 class="sheet-title" id="sheet-title">Details</h3>
          <button class="btn-icon btn-ghost btn-sm" id="sheet-close-btn" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="sheet-content" id="sheet-content"></div>
      </div>

      <!-- Device Home Indicator Bar -->
      <div class="device-home-indicator" aria-hidden="true"></div>
    </div>
  </main>

  <!-- Application Logic Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
